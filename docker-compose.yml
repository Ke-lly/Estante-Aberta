
services:
  mongodb:
    image: mongo:7
    container_name: estante-aberta-mongodb
    restart: unless-stopped
    volumes:
      - dados-mongo:/data/db

  restheart:
    image: softinstigate/restheart:8
    container_name: estante-aberta-restheart
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      RHO: '/mclient/connection-string->"mongodb://mongodb:27017";/http-listener/host->"0.0.0.0"'

  frontend:
    image: nginx:alpine
    container_name: estante-aberta-frontend
    restart: unless-stopped
    depends_on:
      - restheart
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  dados-mongo:
